site_name: Skylords Reborn Blender Artist Guides
site_description: Artist guides for creating, painting, animating and exporting Skylords Reborn models in Blender.
site_author: Maxxxel
site_url: https://maxxxel.github.io/SR-ImpEx-for-Blender/
repo_url: https://github.com/Maxxxel/SR-ImpEx-for-Blender/
repo_name: https://github.com/Maxxxel/SR-ImpEx-for-Blender/
copyright: © 2025 Maxxxel – Battleforge Blender Plugin

theme:
  name: material
  language: en
  logo: assets/images/favicon.png
  favicon: assets/images/favicon.png
  palette:
    - scheme: default
      primary: red
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.integrate
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest
    - header.autohide
  font:
    text: Inter
    code: JetBrains Mono

nav:
  - Overview: index.md
  - Plugin Guides:
      - Artist Model Pipeline: plugin/model_artist_pipeline.md
      - Object Guide: plugin/object_creation_guide.md
      - Unit Guide: plugin/unit_creation_buide.md
      - Building Guide: plugin/building_creation_guide.md
      - Modules, Debris & Resources: plugin/external_resources_guide.md
      - Shading Recipes: plugin/advanced_shading_guide.md
      - Default Material Guide: plugin/material_artist_workflow.md
      - Locator Guide: plugin/advanced_locators_guide.md
      - Animation Set Guide: plugin/advanced_abilities_guide.md
      - Effect Set Guide: plugin/advanced_effects_guide.md
      - Advanced Tutorials:
          - Animation: plugin/animation_advanced_tutorial.md
          - Effects: plugin/effects_advanced_tutorial.md
          - IK: plugin/ik_advanced_tutorial.md

hooks:
  - docs_public.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_signature: true
            docstring_style: google
  - git-revision-date-localized:
      enable_creation_date: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - footnotes
  - attr_list
  - def_list
  - tables
  - abbr
  - md_in_html
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      auto_title: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Maxxxel/SR-ImpEx-for-Blender/
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/drs-plugin/
